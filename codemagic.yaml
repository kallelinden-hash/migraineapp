workflows:
  migrandagbok-ios:
    name: Migrändagbok – iOS-byggtest
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      xcode: latest
    scripts:
      - name: Bygg Migrändagbok
        script: |
          project="Migrandagbok.xcodeproj"
          if [ ! -d "$project" ]; then
            project="Migrandagbok/$project"
          fi

          xcodebuild \
            -project "$project" \
            -scheme Migrandagbok \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            build
